<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- CLAVE PARA RESPONSIVE -->
    <title>Crecimiento Urbano - El Carrizal</title>
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Contenedor de la barra de tiempo */
        #timeline-container {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px 30px; 
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25); 
            text-align: center;
            width: 80%;
            max-width: 500px; /* Para que no se estire de más en PC */
            z-index: 1000;
        }

        #año-actual {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        /* El input range (slider) */
        input[type=range] { 
            width: 100%; 
            cursor: pointer;
            accent-color: #e63946; /* Color del slider */
        }

        /* Contenedor de los puntos/años */
        #puntos-tiempo {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            position: relative;
        }

        .punto-tiempo {
            font-size: 12px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .punto-tiempo.activo {
            color: #e63946;
            transform: scale(1.2);
        }

        /* Ajustes para celulares */
        @media (max-width: 600px) {
            #timeline-container {
                width: 90%;
                bottom: 15px;
                padding: 10px 15px;
            }
            #año-actual { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="timeline-container">
        <h3 id="año-actual">2010</h3>
        <input type="range" id="timeline" min="0" max="3" step="1" value="0">
        <div id="puntos-tiempo">
            <!-- Los puntitos se crean solos con JavaScript -->
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
